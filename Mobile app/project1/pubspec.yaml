name: hcpos
description: "HC-POS — Human-Centric Power Orchestration System. Smart home energy management mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Supabase — DB, Auth, Realtime
  supabase_flutter: ^2.8.4

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Charts
  fl_chart: ^0.70.0

  # Fonts
  google_fonts: ^6.2.1

  # Date/time formatting
  intl: ^0.19.0

  # Loading skeletons
  shimmer: ^3.0.0

  # Icons
  cupertino_icons: ^1.0.8

  # Network connectivity
  connectivity_plus: ^6.1.4

  # Shared preferences for local settings
  shared_preferences: ^2.3.5

  # HTTP client
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-Regular.ttf
          weight: 400
        - asset: fonts/Manrope-Medium.ttf
          weight: 500
        - asset: fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: fonts/Manrope-Bold.ttf
          weight: 700
